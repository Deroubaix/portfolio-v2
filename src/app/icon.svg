<!--
  Favicon.

  The M is an outlined path, not <text>. A favicon renders outside the page, so
  a font-family here would fall back to whatever heavy sans the OS happens to
  have and the letterform would differ per platform. A path is identical
  everywhere.

  Ink ground rather than the site's cream: a cream icon measures ~1.1:1 against
  a light browser tab bar, which is indistinguishable. Ink reads on light tabs
  and still holds its shape on dark ones.

  One letter, not "MD" — at 16px, which is the size that actually matters, the
  D loses its counter and the pair reads as a blob.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#16150F" />
  <path
    d="M14 76 V24 H34 L50 54 L66 24 H86 V76 H72 V42 L57 70 H43 L28 42 V76 Z"
    fill="#EFEDE6"
  />
</svg>
